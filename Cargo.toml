[package]
name = "burley"
version = "0.1.0"
edition = "2024"
description = "A simple HTTP caching proxy server in Rust."

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["now"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
rama = { version = "0.2.0", default-features = false, features = ["http-full", "rustls"] }
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["full", "tracing"] }
tracing = { version = "0.1.44", features = ["log", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
